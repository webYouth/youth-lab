# CI/CD workflow: GitHub -> ACR -> ECS
# Trigger: push to main branch.
#
# Required GitHub repository Secrets (Settings -> Secrets and variables -> Actions):
# - ALIYUN_ACR_REGISTRY: ACR registry domain
# - ALIYUN_ACR_NAMESPACE: ACR namespace, e.g. webyouth
# - ALIYUN_ACR_USERNAME: ACR login username
# - ALIYUN_ACR_PASSWORD: ACR login password/token
# - ECS_HOST: ECS public IP or domain
# - ECS_USER: ECS SSH username
# - ECS_SSH_PRIVATE_KEY: Private key content used by SSH deploy step
# - SMTP_USER: QQ mailbox account, e.g. webyouth@qq.com
# - SMTP_PASS: QQ mailbox SMTP authorization code (not login password)
#
# Optional SMTP Secrets (defaults applied if unset):
# - SMTP_HOST (default: smtp.qq.com)
# - SMTP_PORT (default: 465)
# - MAIL_FROM (default: SMTP_USER or webyouth@qq.com)
# - MAIL_TO   (default: webyouth@qq.com)
#
# Each deploy regenerates /opt/youth-lab/.env on ECS from these secrets.
# Do NOT commit real SMTP credentials into the repository.
name: Deploy to ACR and ECS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
  SERVER_IMAGE: ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/youth-lab-server
  WEB_IMAGE: ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/youth-lab-web
  KL8_IMAGE: ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/youth-lab-kl8
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  MAIL_FROM: ${{ secrets.MAIL_FROM }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  LOTTERY_ADMIN_TOKEN: ${{ secrets.LOTTERY_ADMIN_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login -u "${{ secrets.ALIYUN_ACR_USERNAME }}" --password-stdin "$REGISTRY"

      - name: Build and push server image
        run: |
          docker build -t "$SERVER_IMAGE:latest" -f server/Dockerfile ./server
          docker push "$SERVER_IMAGE:latest"

      - name: Build and push web image
        run: |
          docker build -t "$WEB_IMAGE:latest" -f web/Dockerfile ./web
          docker push "$WEB_IMAGE:latest"

      - name: Build and push kl8 checker image
        run: |
          docker build -t "$KL8_IMAGE:latest" -f kl8/Dockerfile ./kl8
          docker push "$KL8_IMAGE:latest"

      - name: Prepare ECS directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/youth-lab/nginx /opt/youth-lab/ssl /opt/youth-lab/certbot/www /opt/youth-lab/kl8

      - name: Sync compose and nginx configs to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,nginx/default.conf,kl8/tickets.example.yaml"
          target: "/opt/youth-lab"
          strip_components: 0
          overwrite: true

      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          envs: REGISTRY,SERVER_IMAGE,WEB_IMAGE,KL8_IMAGE,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,MAIL_FROM,MAIL_TO,LOTTERY_ADMIN_TOKEN
          # First deploy may need a long time to pull multiple ACR images.
          timeout: 2m
          command_timeout: 40m
          script_stop: true
          script: |
            set -e
            cd /opt/youth-lab
            mkdir -p nginx ssl certbot/www kl8
            if [ -f tickets.example.yaml ] && [ ! -f kl8/tickets.example.yaml ]; then
              mv tickets.example.yaml kl8/tickets.example.yaml
            fi
            if [ ! -f kl8/tickets.yaml ]; then
              cp -f kl8/tickets.example.yaml kl8/tickets.yaml
              echo "created kl8/tickets.yaml from example; please update daily numbers"
            fi
            if [ ! -f kl8/ledger.json ]; then
              printf '{}\n' > kl8/ledger.json
            fi
            chmod 666 kl8/ledger.json || true

            SMTP_HOST_VALUE="${SMTP_HOST:-smtp.qq.com}"
            SMTP_PORT_VALUE="${SMTP_PORT:-465}"
            SMTP_USER_VALUE="${SMTP_USER:-webyouth@qq.com}"
            SMTP_PASS_VALUE="${SMTP_PASS:-}"
            MAIL_FROM_VALUE="${MAIL_FROM:-$SMTP_USER_VALUE}"
            MAIL_TO_VALUE="${MAIL_TO:-webyouth@qq.com}"
            LOTTERY_ADMIN_TOKEN_VALUE="${LOTTERY_ADMIN_TOKEN:-}"

            if [ -z "$SMTP_PASS_VALUE" ]; then
              echo "ERROR: SMTP_PASS secret is empty. Set GitHub Secret SMTP_PASS (QQ authorization code)."
              exit 1
            fi

            # Always regenerate production env from CI secrets.
            umask 077
            {
              printf 'SERVER_IMAGE=%s\n' "$SERVER_IMAGE"
              printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE"
              printf 'KL8_IMAGE=%s\n' "$KL8_IMAGE"
              printf 'SMTP_HOST=%s\n' "$SMTP_HOST_VALUE"
              printf 'SMTP_PORT=%s\n' "$SMTP_PORT_VALUE"
              printf 'SMTP_USER=%s\n' "$SMTP_USER_VALUE"
              printf 'SMTP_PASS=%s\n' "$SMTP_PASS_VALUE"
              printf 'MAIL_FROM=%s\n' "$MAIL_FROM_VALUE"
              printf 'MAIL_TO=%s\n' "$MAIL_TO_VALUE"
              printf 'LOTTERY_NOTIFY_URL=%s\n' "http://host.docker.internal:8090/api/v1/admin/notify"
              printf 'LOTTERY_ADMIN_TOKEN=%s\n' "$LOTTERY_ADMIN_TOKEN_VALUE"
            } > /opt/youth-lab/.env
            chmod 600 /opt/youth-lab/.env
            echo "wrote /opt/youth-lab/.env from GitHub Secrets"

            export SERVER_IMAGE="$SERVER_IMAGE"
            export WEB_IMAGE="$WEB_IMAGE"
            export KL8_IMAGE="$KL8_IMAGE"
            echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login -u "${{ secrets.ALIYUN_ACR_USERNAME }}" --password-stdin "$REGISTRY"
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              COMPOSE="docker compose"
            fi
            $COMPOSE --env-file .env -f docker-compose.prod.yml pull
            $COMPOSE --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
            # Ensure latest nginx config is applied (volume mount does not auto-reload).
            $COMPOSE --env-file .env -f docker-compose.prod.yml exec -T nginx nginx -s reload || \
              $COMPOSE --env-file .env -f docker-compose.prod.yml up -d --force-recreate nginx
            docker image prune -f
            $COMPOSE --env-file .env -f docker-compose.prod.yml ps
