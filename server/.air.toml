# Air config for Go backend hot reload in development.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./main.go"
  bin = "tmp/server"
  full_bin = "./tmp/server"
  include_ext = ["go", "tpl", "tmpl", "html", "proto"]
  exclude_dir = ["tmp", "vendor", "gen"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
