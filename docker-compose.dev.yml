# Development compose overrides for full-stack hot reload.
services:
  server:
    image: golang:1.26.2-alpine
    working_dir: /app
    environment:
      - GIN_HTTP_ADDR=:8080
      - GRPC_ADDR=:50051
      - GOCACHE=/tmp/go-build
      - GOPATH=/go
    command: sh -c "[ -x /go/bin/air ] || go install github.com/air-verse/air@latest; /go/bin/air -c .air.toml"
    volumes:
      - ./server:/app
      - server_go_pkg:/go/pkg
      - server_go_bin:/go/bin
      - server_go_cache:/tmp/go-build
    expose:
      - "8080"
      - "50051"

  web:
    image: node:20-alpine
    working_dir: /app
    environment:
      - NODE_ENV=development
      - GRPC_SERVER_ADDR=server:50051
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0 -p 3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    ports:
      - "3000:3000"

volumes:
  server_go_pkg:
  server_go_bin:
  server_go_cache:
  web_node_modules:
  web_next_cache:
