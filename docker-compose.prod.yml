# ECS initialization steps:
# 1) mkdir -p /opt/youth-lab && cd /opt/youth-lab
# 2) Put this file and nginx/default.conf into /opt/youth-lab
# 3) Create directories for TLS and ACME:
#    mkdir -p ssl certbot/www
# 4) Prepare 快乐8 checker (internal only, no public ports):
#    mkdir -p kl8
#    cp kl8/tickets.example.yaml kl8/tickets.yaml   # then edit daily numbers
#    create .env with SMTP_USER / SMTP_PASS / MAIL_TO

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - server
    networks:
      - youth-lab-net

  server:
    image: ${SERVER_IMAGE:-crpi-hkob27jgcmdlnekv.cn-shenzhen.personal.cr.aliyuncs.com/webyouth/youth-lab-server}:latest
    expose:
      - "50051"
      - "8080"
    environment:
      - GIN_MODE=release
    networks:
      - youth-lab-net

  web:
    image: ${WEB_IMAGE:-crpi-hkob27jgcmdlnekv.cn-shenzhen.personal.cr.aliyuncs.com/webyouth/youth-lab-web}:latest
    expose:
      - "3000"
    environment:
      - GRPC_SERVER_ADDR=server:50051
    depends_on:
      - server
    networks:
      - youth-lab-net

  # Internal-only Happy8 checker. No ports published.
  kl8:
    image: ${KL8_IMAGE:-crpi-hkob27jgcmdlnekv.cn-shenzhen.personal.cr.aliyuncs.com/webyouth/youth-lab-kl8}:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - KL8_TICKETS_FILE=/data/tickets.yaml
      - KL8_LEDGER_FILE=/data/ledger.json
      - KL8_START_HOUR=22
      - KL8_RETRY_MINUTES=5
      - MAIL_TO=${MAIL_TO:-webyouth@qq.com}
      - LOTTERY_NOTIFY_URL=${LOTTERY_NOTIFY_URL:-http://host.docker.internal:8090/api/v1/admin/notify}
      - LOTTERY_ADMIN_TOKEN=${LOTTERY_ADMIN_TOKEN:-}
    volumes:
      - ./kl8/tickets.yaml:/data/tickets.yaml:ro
      - ./kl8/ledger.json:/data/ledger.json
    networks:
      - youth-lab-net

networks:
  youth-lab-net:
    driver: bridge
