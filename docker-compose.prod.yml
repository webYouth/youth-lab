# ECS initialization steps:
# 1) mkdir -p /opt/youth-lab && cd /opt/youth-lab
# 2) Put this file and nginx/default.conf into /opt/youth-lab
# 3) Create directories for TLS and ACME:
#    mkdir -p ssl certbot/www

version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - server
    networks:
      - youth-lab-net

  server:
    image: ${SERVER_IMAGE:-registry.cn-hangzhou.aliyuncs.com/webyouth/youth-lab-server}:latest
    expose:
      - "50051"
      - "8080"
    environment:
      - GIN_MODE=release
    networks:
      - youth-lab-net

  web:
    image: ${WEB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/webyouth/youth-lab-web}:latest
    expose:
      - "3000"
    environment:
      - GRPC_SERVER_ADDR=server:50051
    depends_on:
      - server
    networks:
      - youth-lab-net

networks:
  youth-lab-net:
    driver: bridge
