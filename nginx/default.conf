# Production Nginx config for youth-lab.
# HTTPS can be enabled later by adding:
# - listen 443 ssl;
# - ssl_certificate /etc/nginx/ssl/your.crt;
# - ssl_certificate_key /etc/nginx/ssl/your.key;
# and mounting certificates into /etc/nginx/ssl.

resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name webyouth.top www.webyouth.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /blog {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /blog/_next/ {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        set $server_upstream server:8080;
        proxy_pass http://$server_upstream/;
        proxy_set_header Host $host;
    }

    location = / {
        return 302 /blog;
    }
}
