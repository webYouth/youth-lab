# Production Nginx config for youth-lab.
# HTTPS can be enabled later by adding:
# - listen 443 ssl;
# - ssl_certificate /etc/nginx/ssl/your.crt;
# - ssl_certificate_key /etc/nginx/ssl/your.key;
# and mounting certificates into /etc/nginx/ssl.

upstream web_upstream {
    server web:3000;
}

upstream server_upstream {
    server server:8080;
}

server {
    listen 80;
    server_name webyouth.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /blog/_next/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://server_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 302 /blog;
    }
}
