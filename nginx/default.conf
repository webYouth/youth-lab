# Production Nginx config for youth-lab.
# HTTPS can be enabled later by adding:
# - listen 443 ssl;
# - ssl_certificate /etc/nginx/ssl/your.crt;
# - ssl_certificate_key /etc/nginx/ssl/your.key;
# and mounting certificates into /etc/nginx/ssl.

upstream web_upstream {
    server web:3000;
}

upstream server_upstream {
    server server:8080;
}

# lottery-ai 容器使用 host 网络，监听宿主机 8090。nginx 经 host-gateway 反代，手机只需访问 80。
upstream lottery_ai_upstream {
    server host.docker.internal:8090;
}

server {
    listen 80;
    server_name webyouth.top www.webyouth.top _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /lottery-ai/ {
        proxy_pass http://lottery_ai_upstream/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Strip /api prefix: /api/health -> /health
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /blog/;
    }
}
