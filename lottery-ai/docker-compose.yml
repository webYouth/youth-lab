# 彩票 AI：使用宿主机网络，直连本机 PostgreSQL 14（127.0.0.1:5432）
# 免责声明：预测结果仅供个人学习研究，不构成投注建议。
services:
  lottery-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    environment:
      HTTP_ADDR: ":8090"
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/lottery_ai?sslmode=disable}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-${LOTTERY_ADMIN_TOKEN:-change-me-admin}}
      API_TOKEN: ${API_TOKEN:-}
      HISTORY_N: ${HISTORY_N:-500}
      TZ: Asia/Shanghai
      DEEP_SEEK_API_KEY: ${DEEP_SEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    restart: unless-stopped
