version: "3.9"

# Docker Compose for youth blog local stack.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - web
    networks:
      - youth-blog-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - GIN_HTTP_ADDR=:8080
      - GRPC_ADDR=:50051
    expose:
      - "8080"
      - "50051"
    networks:
      - youth-blog-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - GRPC_SERVER_ADDR=server:50051
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - server
    networks:
      - youth-blog-net

networks:
  youth-blog-net:
    driver: bridge
