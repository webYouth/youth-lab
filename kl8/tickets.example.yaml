# Example tickets for 快乐8 checker.
# Copy to tickets.yaml on ECS (/opt/youth-lab/kl8/tickets.yaml) and update daily.
#
# play: 选一~选十
# mode: 单式 / 复式
# multiplier: 投注倍数
# numbers: 复式选号
# bets: 单式每注号码

tickets:
  - id: "ticket-1"
    play: "选九"
    mode: "复式"
    multiplier: 2
    numbers: [3, 7, 18, 19, 20, 26, 27, 44, 46, 56]

  - id: "ticket-2"
    play: "选十"
    mode: "单式"
    multiplier: 2
    bets:
      - [5, 10, 11, 16, 18, 19, 29, 36, 39, 79]
      - [3, 4, 9, 11, 16, 18, 19, 28, 36, 39]

  - id: "ticket-3"
    play: "选十"
    mode: "单式"
    multiplier: 2
    bets:
      - [2, 12, 13, 17, 20, 24, 32, 44, 64, 77]
      - [1, 8, 10, 19, 21, 29, 49, 51, 59, 63]
      - [11, 14, 16, 37, 46, 48, 49, 64, 66, 78]
      - [15, 17, 24, 25, 33, 34, 49, 65, 69, 79]
      - [4, 11, 24, 32, 45, 51, 60, 62, 63, 79]
